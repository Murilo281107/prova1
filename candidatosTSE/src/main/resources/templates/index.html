<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - Eleições 2026 - MG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="topo">
        <h1>Candidatos - Eleições 2026 - MG</h1>
    </header>

    <main>
        <form method="get" th:action="@{/}" class="filtros">
            <input type="text" name="texto" placeholder="Nome ou número"
                   th:value="${textoSelecionado}">

            <select name="cargo">
                <option value="" th:selected="${cargoSelecionado == ''}">Todos os cargos</option>
                <option th:each="c : ${cargos}"
                        th:value="${c}"
                        th:text="${c}"
                        th:selected="${c == cargoSelecionado}"></option>
            </select>

            <select name="partido">
                <option value="" th:selected="${partidoSelecionado == ''}">Todos os partidos</option>
                <option th:each="p : ${partidos}"
                        th:value="${p}"
                        th:text="${p}"
                        th:selected="${p == partidoSelecionado}"></option>
            </select>

            <button type="submit">Filtrar</button>
            <a th:href="@{/}" class="limpar">Limpar</a>
        </form>

        <p class="resultado-info">
            <span th:text="${totalEncontrado}">0</span> candidato(s) encontrado(s).
        </p>

        <p th:if="${totalEncontrado == 0}" class="sem-resultado">
            Nenhum candidato encontrado com esses filtros.
        </p>

        <div class="grade-candidatos">
            <div class="card" th:each="cand : ${candidatos}">
                <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                     th:alt="${cand.nomeUrna}" class="foto-candidato" loading="lazy">

                <div class="card-corpo">
                    <h2 class="nome" th:text="${cand.nomeUrna}">Nome de urna</h2>
                    <p class="numero" th:text="${cand.nrCandidato}">00000</p>
                    <p class="cargo" th:text="${cand.cargo}">Cargo</p>
                    <p class="partido" th:text="${cand.siglaPartido}">PART</p>

                    <p class="situacao"
                       th:if="${cand.situacaoCandidatura != null and !cand.situacaoCandidatura.isBlank()}"
                       th:text="${cand.situacaoCandidatura}">Situação</p>

                    <p class="extra" th:if="${cand.idade > 0}"
                       th:text="${cand.idade + ' anos'}">idade</p>

                    <p class="extra"
                       th:if="${cand.ocupacao != null and !cand.ocupacao.isBlank()}"
                       th:text="${cand.ocupacao}">Ocupação</p>

                    <p class="extra"
                       th:if="${cand.grauInstrucao != null and !cand.grauInstrucao.isBlank()}"
                       th:text="${cand.grauInstrucao}">Escolaridade</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
